<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Strength Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 50px 15px;
        }

        .container {
            background: white;
            max-width: 420px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
        }

        input {
            border: 1px solid #aaa;
        }

        button {
            background: #2459d3;
            color: white;
            border: none;
            cursor: pointer;
        }

        .Weak {
            color: #d62828;
        }

        .Medium {
            color: #d97706;
        }

        .Strong {
            color: #16803c;
        }

        ul {
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Password Strength Checker</h1>
        <p>Check your password strength</p>

        <form method="POST">
            <input
                type="password"
                name="password"
                placeholder="Enter a test password"
                required
            >

            <button type="submit">
                Check Strength
            </button>
        </form>

        {% if strength %}
            <h2 class="{{ strength }}">
                Strength: {{ strength }}
            </h2>

            {% if suggestions %}
                <h3>Suggestions</h3>

                <ul>
                    {% for suggestion in suggestions %}
                        <li>{{ suggestion }}</li>
                    {% endfor %}
                </ul>

            {% else %}
                <p>Your password meets all five checks.</p>
            {% endif %}
        {% endif %}

    </div>
</body>
</html>
